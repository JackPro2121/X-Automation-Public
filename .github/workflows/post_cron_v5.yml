name: "X Video Pipeline v5 — AI Video Posts (Paused)"

on:
  workflow_dispatch:

concurrency:
  group: x-automation-publisher
  cancel-in-progress: false

jobs:
  run-v5-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Cron Regression Suite
        env:
          X_PREMIUM: 'true'
        run: npm run test:cron

      - name: Run v5 Video Pipeline
        env:
          X_PREMIUM: 'true'
          V5_ENABLED: ${{ vars.X_V5_ENABLED || 'false' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_API_KEY_2: ${{ secrets.APIFY_API_KEY_2 }}
          APIFY_API_KEY_3: ${{ secrets.APIFY_API_KEY_3 }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_API_KEY_2: ${{ secrets.MIMO_API_KEY_2 }}
          MIMO_API_KEY_3: ${{ secrets.MIMO_API_KEY_3 }}
          MIMO_API_KEY_4: ${{ secrets.MIMO_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: node cron/v5/seed_and_post.js

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "❌ v5 video pipeline failed on run ${{ github.run_id }}",
              "unfurl_links": false
            }'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
