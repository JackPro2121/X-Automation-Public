name: "X Autonomous Quote Radar (v13) — Model Drops & Leaks (6x Daily)"

on:
  # Schedule: 6 runs per day during peak US active daytime (EDT 09:00 - 19:00 / PDT 06:00 - 16:00):
  #   13:00 UTC = ~09:00 AM EDT (Morning kick-off in NY / East Coast)
  #   15:00 UTC = ~11:00 AM EDT (SF / Silicon Valley waking up & morning releases)
  #   17:00 UTC = ~01:00 PM EDT (Lunchtime peak engagement & hot takes)
  #   19:00 UTC = ~03:00 PM EDT (Afternoon model drops & benchmark leaks)
  #   21:00 UTC = ~05:00 PM EDT (End of US workday & paper summaries)
  #   23:00 UTC = ~07:00 PM EDT (US evening prime discussion)
  #
  # Interleaved on ODD hours (13, 15, 17, 19, 21, 23) so it never collides with
  # v9 (14, 18, 22), v11 (16), or v12 (20).
  schedule:
    - cron: '0 13,15,17,19,21,23 * * *'
  workflow_dispatch:

concurrency:
  # All X posting paths share one queue to prevent simultaneous publishes.
  group: x-automation-publisher
  cancel-in-progress: false

jobs:
  run-v13-quote-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Gate: tests fail, publishing is skipped
      - name: Run Test Suite (logic gates)
        env:
          X_PREMIUM: 'true'
        run: npm run test:imports && npm run test:cron

      - name: Run v13 Quote Radar Pipeline
        env:
          X_PREMIUM: 'true'
          # Apify Scraper (ultra-low cost actor apidojo~tweet-scraper)
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          # Ollama Cloud (Primary Writer — gemma4:31b)
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'gemma4:31b' }}
          # Secondary Fallback Writers
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Buffer publishing
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          DIRECT_X_PUBLISH_ENABLED: 'false'
          # Supabase (dedup & run tracking)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Slack alerts
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # Daily cap
          V13_DAILY_MAX: '6'
        run: node cron/v13/quote_radar.js

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "❌ v13 Autonomous Quote Radar pipeline failed on run ${{ github.run_id }}",
              "unfurl_links": false
            }'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
