name: X Auto Comment & Reply (v7) — Growth & Inbound [PAUSED]

on:
  # [PAUSED] Automatic schedule temporarily disabled pending X Developer API credits reactivation
  # schedule:
  #   - cron: '0 3,8,13,17,22 * * *'
  workflow_dispatch:

concurrency:
  group: x-automation-replies
  cancel-in-progress: false

jobs:
  run-v7-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run v7 Auto-Reply & Comment Pipeline
        env:
          X_PREMIUM: 'true'
          # Official X API v2 Credentials (OAuth 1.0a)
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY || secrets.TWITTER_API_KEY || secrets.CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET || secrets.TWITTER_API_SECRET || secrets.SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN || secrets.TWITTER_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET || secrets.TWITTER_ACCESS_SECRET || secrets.ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN || secrets.BEARER_TOKEN }}
          # Supabase
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Gemini Keys (Primary Writer)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          # OpenRouter Keys (Secondary Writer)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          # Groq Keys (Fallback)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          # Slack Notifications
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # Apify Key Rotation (Scraping)
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_API_KEY_2: ${{ secrets.APIFY_API_KEY_2 }}
          APIFY_API_KEY_3: ${{ secrets.APIFY_API_KEY_3 }}
          APIFY_API_KEY_4: ${{ secrets.APIFY_API_KEY_4 }}
          APIFY_API_KEY_5: ${{ secrets.APIFY_API_KEY_5 }}
          APIFY_API_KEY_6: ${{ secrets.APIFY_API_KEY_6 }}
          APIFY_API_KEY_7: ${{ secrets.APIFY_API_KEY_7 }}
          APIFY_API_KEY_8: ${{ secrets.APIFY_API_KEY_8 }}
          APIFY_API_KEY_9: ${{ secrets.APIFY_API_KEY_9 }}
          APIFY_API_KEY_10: ${{ secrets.APIFY_API_KEY_10 }}
          APIFY_API_KEY_11: ${{ secrets.APIFY_API_KEY_11 }}
          APIFY_API_KEY_12: ${{ secrets.APIFY_API_KEY_12 }}
          APIFY_API_KEY_13: ${{ secrets.APIFY_API_KEY_13 }}
          APIFY_API_KEY_14: ${{ secrets.APIFY_API_KEY_14 }}
          APIFY_API_KEY_15: ${{ secrets.APIFY_API_KEY_15 }}
          APIFY_API_KEY_16: ${{ secrets.APIFY_API_KEY_16 }}
          APIFY_API_KEY_17: ${{ secrets.APIFY_API_KEY_17 }}
          APIFY_API_KEY_18: ${{ secrets.APIFY_API_KEY_18 }}
          APIFY_API_KEY_19: ${{ secrets.APIFY_API_KEY_19 }}
          APIFY_API_KEY_20: ${{ secrets.APIFY_API_KEY_20 }}
          APIFY_API_KEY_21: ${{ secrets.APIFY_API_KEY_21 }}
          APIFY_API_KEY_22: ${{ secrets.APIFY_API_KEY_22 }}
          APIFY_API_KEY_23: ${{ secrets.APIFY_API_KEY_23 }}
          APIFY_API_KEY_24: ${{ secrets.APIFY_API_KEY_24 }}
          APIFY_API_KEY_25: ${{ secrets.APIFY_API_KEY_25 }}
          APIFY_API_KEY_26: ${{ secrets.APIFY_API_KEY_26 }}
          APIFY_API_KEY_27: ${{ secrets.APIFY_API_KEY_27 }}
          APIFY_API_KEY_28: ${{ secrets.APIFY_API_KEY_28 }}
        run: node cron/v7/auto_reply_comments.js

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "❌ v7 Auto-Reply & Comment pipeline failed on run ${{ github.run_id }}",
              "unfurl_links": false
            }'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
