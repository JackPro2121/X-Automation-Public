name: X Top Creator Reply Sniper (v7) — 5x Daily

on:
  schedule:
    # 5x/day — aligned to US peak hours when top creators post most
    # 12:00 UTC = 8:00 AM EDT  (US morning, creators share overnight news)
    # 14:00 UTC = 10:00 AM EDT (US mid-morning, hot debates start)
    # 17:00 UTC = 1:00 PM EDT  (US lunch, high engagement window)
    # 20:00 UTC = 4:00 PM EDT  (US afternoon, peak creator posting)
    # 22:00 UTC = 6:00 PM EDT  (US evening wrap-up, viral posts peak)
    - cron: '0 12,14,17,20,22 * * *'
  workflow_dispatch:

concurrency:
  group: x-automation-sniper-v7
  cancel-in-progress: false

jobs:
  run-v7-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Run v7 Top Creator Reply Sniper
        env:
          # X Login Credentials (Playwright headless login)
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          # X API v2 Bearer Token (free read — fetch creator tweets)
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Supabase (dedup / cooldown state)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Gemini Keys (Primary Reply Writer)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          # OpenRouter Keys (Fallback Reply Writer)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          # Slack Notifications
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # Premium flag
          X_PREMIUM: 'true'
        run: node cron/v7/sniper_reply.js

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": ":x: v7 Sniper pipeline failed on run ${{ github.run_id }}",
              "unfurl_links": false
            }'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
